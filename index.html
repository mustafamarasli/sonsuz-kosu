<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sonsuz Koşu">
<meta name="theme-color" content="#6fb9f0">
<meta name="description" content="Sonsuz Koşu: kaydır, zıpla, eğil, engelleri aş.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Sonsuz Koşu</title>
<style>
:root{
  --ink:#1b3358; --ink2:#4a5f80; --blue:#2a6fdb; --blue-d:#1d56b3; --white:#fff;
  --panel:rgba(255,255,255,.93); --line:rgba(27,51,88,.12);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#6fb9f0;overscroll-behavior:none;touch-action:none;
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink)}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none}
canvas{position:absolute;left:0;top:0;display:block}
[hidden]{display:none!important}

/* HUD: 3 sutun, birbirine binmez */
#hud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 0 calc(var(--sal) + 12px);pointer-events:none}
#score{justify-self:center;min-width:64px;text-align:center;font-size:clamp(30px,9vw,44px);font-weight:800;line-height:1;color:#fff;
  background:rgba(20,50,100,.42);border-radius:999px;padding:6px 20px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  text-shadow:0 2px 0 rgba(20,60,110,.3);font-variant-numeric:tabular-nums}
#score.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.icon{pointer-events:auto;width:48px;height:48px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;
  background:rgba(255,255,255,.34);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 2px 10px rgba(20,60,110,.2);cursor:pointer}
.icon:active{transform:scale(.94);background:rgba(255,255,255,.5)}
.icon svg{width:22px;height:22px;fill:currentColor}

/* Katmanlar */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 16px) calc(var(--sar) + 20px) calc(var(--sab) + 16px) calc(var(--sal) + 20px);
  background:rgba(20,60,110,.18)}
.panel{width:100%;max-width:340px;max-height:100%;overflow:auto;background:var(--panel);border-radius:26px;padding:26px 22px 22px;
  box-shadow:0 18px 50px rgba(20,50,100,.28);display:flex;flex-direction:column;align-items:stretch;gap:16px;text-align:center}
h1{margin:0;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.5px}
h2{margin:0;font-size:30px;line-height:1.1;font-weight:800}
.sub{margin:-8px 0 0;font-size:15px;color:var(--ink2)}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left}
.keys li{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;background:rgba(42,111,219,.07);border-radius:14px;padding:8px 12px}
.keys b{flex:none;width:34px;height:34px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:18px;line-height:1}
.best{margin:0;font-size:14px;color:var(--ink2)}
.best strong{color:var(--ink);font-size:16px}
.big{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.badge{align-self:center;background:#ffb703;color:#4a3300;font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px}
.btn{appearance:none;border:0;cursor:pointer;width:100%;min-height:56px;border-radius:16px;font:inherit;font-size:19px;font-weight:800;
  background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);min-height:50px;font-size:16px}
.btn.ghost:active{transform:none;background:rgba(0,0,0,.04)}
.stack{display:flex;flex-direction:column;gap:12px}
@media (max-height:560px){
  .panel{padding:16px;gap:10px}h1{font-size:26px}.big{font-size:44px}.keys{display:none}.btn{min-height:48px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div id="hud" hidden>
    <button class="icon" id="btnPause" aria-label="Duraklat"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
    <div id="score">0</div>
    <button class="icon" id="btnSound" aria-label="Sesi aç/kapat"></button>
  </div>

  <div class="ov" id="ovMenu">
    <div class="panel">
      <h1>Sonsuz Koşu</h1>
      <p class="sub">Engellerden kaç, puan topla.</p>
      <ul class="keys">
        <li><b>↔</b>Sağa / sola kaydır: şerit değiştir</li>
        <li><b>↑</b>Yukarı kaydır: zıpla</li>
        <li><b>↓</b>Aşağı kaydır: eğil</li>
      </ul>
      <p class="best">En iyi: <strong id="bestMenu">0</strong></p>
      <button class="btn" id="btnStart">Başla</button>
    </div>
  </div>

  <div class="ov" id="ovPause" hidden>
    <div class="panel">
      <h2>Duraklatıldı</h2>
      <div class="stack">
        <button class="btn" id="btnResume">Devam et</button>
        <button class="btn ghost" id="btnSound2">Ses: Açık</button>
        <button class="btn ghost" id="btnMenu1">Ana menü</button>
      </div>
    </div>
  </div>

  <div class="ov" id="ovOver" hidden>
    <div class="panel">
      <h2>Bitti!</h2>
      <div class="big" id="finalScore">0</div>
      <div class="badge" id="newBest" hidden>Yeni rekor!</div>
      <p class="best">En iyi: <strong id="bestOver">0</strong></p>
      <div class="stack">
        <button class="btn" id="btnAgain">Tekrar oyna</button>
        <button class="btn ghost" id="btnMenu2">Ana menü</button>
      </div>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('c'),ctx=cv.getContext('2d');
const ICON_ON='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

/* ---------- kalici veri (hata verirse yok say) ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
let best=parseInt(store.get('sk_best','0'),10)||0;
let muted=store.get('sk_muted','0')==='1';

/* ---------- boyutlar / projeksiyon ---------- */
const D=5,ZMAX=90;
let W=0,H=0,dpr=1,horizon=0,nearY=0,unit=0,laneW=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  cv.style.width=W+'px';cv.style.height=H+'px';
  horizon=H*0.34;nearY=H*0.83;
  unit=Math.min(H*0.095,W*0.2);
  laneW=Math.min(W*0.29,H*0.2);
}
const sc=z=>D/(D+z);
const PX=(lane,z)=>W/2+lane*laneW*sc(z);
const PY=(z,h)=>horizon+(nearY-horizon)*sc(z)-(h||0)*unit*sc(z);

/* ---------- ses ---------- */
let AC=null;
function unlock(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
}
function tone(f1,f2,dur,type,vol){
  if(muted||!AC)return;
  try{
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
    g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.03);
  }catch(e){}
}
const sfx={
  jump:()=>tone(320,640,.16,'sine',.13),
  slide:()=>tone(260,120,.18,'triangle',.12),
  move:()=>tone(420,360,.06,'sine',.05),
  score:()=>{tone(740,740,.09,'sine',.1);setTimeout(()=>tone(980,980,.12,'sine',.1),70)},
  hit:()=>{tone(180,40,.4,'sawtooth',.16);tone(90,35,.45,'square',.1)}
};

/* ---------- oyun durumu ---------- */
let state='menu';
let dist=0,speed=11,score=0,lane=0,target=0,py=0,vy=0,sliding=false,slideT=0,crouch=0;
let rows=[],nextRow=32,shake=0,flash=0,t=0,parts=[],runPhase=0;
const clouds=[];for(let i=0;i<6;i++)clouds.push({x:Math.random()*400,y:.04+Math.random()*.2,s:.7+Math.random()*.9,v:4+Math.random()*7});

function reset(){
  dist=0;speed=11;score=0;lane=0;target=0;py=0;vy=0;sliding=false;slideT=0;crouch=0;
  rows=[];nextRow=32;shake=0;flash=0;parts=[];
  setScore(0,false);
}
const scoreEl=$('score');
function setScore(v,pop){
  scoreEl.textContent=v;
  if(pop){scoreEl.classList.remove('pop');void scoreEl.offsetWidth;scoreEl.classList.add('pop')}
}

function spawnRow(z){
  const easy=dist<180;
  const free=[-1,0,1];
  const pick=()=>free.splice(Math.floor(Math.random()*free.length),1)[0];
  const obs=[];
  const k=Math.random();
  const cnt=()=>easy?1:1+(Math.random()<.45?1:0)+(Math.random()<.12?1:0);
  if(k<.3){
    obs.push({lane:pick(),type:'wall'});
    if(!easy&&Math.random()<.5)obs.push({lane:pick(),type:'wall'});
  }else if(k<.55){
    for(let i=cnt();i>0;i--)obs.push({lane:pick(),type:'low'});
  }else if(k<.78){
    for(let i=cnt();i>0;i--)obs.push({lane:pick(),type:'high'});
  }else{
    obs.push({lane:pick(),type:'wall'});
    obs.push({lane:pick(),type:Math.random()<.5?'low':'high'});
  }
  rows.push({z,obs,done:false,hit:false});
}

function dust(x,y,n,col){
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*160,vy:-Math.random()*90,life:.5+Math.random()*.3,max:.8,r:3+Math.random()*4,col:col||'rgba(255,255,255,.75)'});
}

function collides(o){
  if(o.type==='wall')return true;
  if(o.type==='low')return py<.78;
  return !sliding; // high
}

function die(row){
  if(state!=='play')return;
  state='dying';row.hit=true;shake=.5;flash=1;
  dust(PX(lane,0),PY(0,py)-unit*.8,26,'rgba(255,200,80,.95)');
  sfx.hit();
  if(score>best){best=score;store.set('sk_best',String(best));$('newBest').hidden=false}else $('newBest').hidden=true;
  setTimeout(()=>{
    if(state!=='dying')return;
    state='over';
    $('finalScore').textContent=score;$('bestOver').textContent=best;$('bestMenu').textContent=best;
    $('hud').hidden=true;$('ovOver').hidden=false;
  },650);
}

function update(dt){
  t+=dt;
  for(const c of clouds){c.x+=c.v*dt;if(c.x>W+120)c.x=-140}
  if(state==='menu'||state==='over'){dist+=5*dt;runPhase+=dt*9;return}
  if(state==='dying'){shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt*2.5);speed=Math.max(0,speed-dt*40);dist+=speed*dt;stepParts(dt);return}
  if(state!=='play'){return}
  speed=Math.min(26,11+dist*.004);
  dist+=speed*dt;
  runPhase+=dt*(8+speed*.35);
  lane+=(target-lane)*Math.min(1,dt*16);
  if(py>0||vy>0){
    vy-=34*dt;py+=vy*dt;
    if(py<=0){py=0;vy=0;dust(PX(lane,0),PY(0,0),7)}
  }
  if(sliding){slideT-=dt;if(slideT<=0)sliding=false}
  crouch+=((sliding?1:0)-crouch)*Math.min(1,dt*20);
  while(nextRow<dist+ZMAX){
    spawnRow(nextRow);
    nextRow+=Math.max(15,speed*1.3)+Math.random()*7;
  }
  for(const r of rows){
    const z=r.z-dist;
    if(!r.hit&&Math.abs(z)<.65){
      for(const o of r.obs){
        if(Math.abs(lane-o.lane)<.6&&collides(o)){die(r);break}
      }
    }
    if(state!=='play')break;
    if(!r.done&&z<-.9){r.done=true;score++;setScore(score,true);sfx.score()}
  }
  while(rows.length&&rows[0].z-dist<-8)rows.shift();
  stepParts(dt);
}
function stepParts(dt){
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt}
  parts=parts.filter(p=>p.life>0);
}

/* ---------- cizim yardimcilari ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function circ(x,y,r){ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,6.2832)}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,'#5fb0ee');g.addColorStop(1,'#d3ecff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,horizon+2);
  const sg=ctx.createRadialGradient(W*.82,horizon*.28,0,W*.82,horizon*.28,horizon*.5);
  sg.addColorStop(0,'rgba(255,255,255,.75)');sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,horizon);
  ctx.fillStyle='rgba(255,255,255,.92)';
  for(const c of clouds){
    const x=c.x,y=c.y*horizon+10,s=c.s*Math.min(1,W/420+.35);
    ctx.beginPath();circ(x,y,16*s);circ(x+18*s,y-8*s,20*s);circ(x+40*s,y,16*s);circ(x+20*s,y+5*s,18*s);ctx.fill();
  }
}
function hills(amp,col,freq,off){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,horizon+1);
  for(let x=0;x<=W+10;x+=10)ctx.lineTo(x,horizon-amp*(.5+.5*Math.sin(x*freq+off)));
  ctx.lineTo(W,horizon+1);ctx.closePath();ctx.fill();
}
function drawGround(){
  ctx.fillStyle='#5fc34e';ctx.fillRect(0,horizon,W,H-horizon);
  const base=Math.floor(dist/3),fr=dist%3;
  for(let i=0;i<32;i++){
    const za=i*3-fr,zb=za+3,idx=base+i;
    const y1=PY(zb,0),y2=PY(za,0);
    if(idx%2===0){ctx.fillStyle='rgba(30,120,40,.10)';ctx.fillRect(0,y1,W,y2-y1+1)}
    // serit cizgileri
    ctx.fillStyle='rgba(255,255,255,.26)';
    const bs=idx%2===0?[-1.5,-.5,.5,1.5]:[-1.5,1.5];
    for(const b of bs){
      const hw=.028;
      ctx.beginPath();
      ctx.moveTo(PX(b-hw,za),y2);ctx.lineTo(PX(b+hw,za),y2);ctx.lineTo(PX(b+hw,zb),y1);ctx.lineTo(PX(b-hw,zb),y1);ctx.closePath();ctx.fill();
    }
  }
  const hz=ctx.createLinearGradient(0,horizon,0,horizon+(H-horizon)*.28);
  hz.addColorStop(0,'rgba(211,236,255,.85)');hz.addColorStop(1,'rgba(211,236,255,0)');
  ctx.fillStyle=hz;ctx.fillRect(0,horizon,W,(H-horizon)*.28);
}
function fade(z){return Math.max(0,Math.min(1,(ZMAX-z)/25,(z+2.5)/1.5))}
function drawTrees(){
  const sp=10,base=Math.floor(dist/sp),fr=dist%sp;
  for(let i=9;i>=0;i--){
    for(const side of [-1,1]){
      const idx=base+i+(side>0?1000:0);
      const z=i*sp-fr+(side>0?5:0);
      if(z<-2)continue;
      const s=sc(z),x=PX(side*(2.9+((idx*7)%3)*.25),z),y=PY(z,0),u=unit*s;
      ctx.globalAlpha=fade(z);
      ctx.fillStyle='rgba(20,90,30,.18)';ctx.beginPath();ctx.ellipse(x,y,u*.9,u*.22,0,0,6.2832);ctx.fill();
      ctx.fillStyle='#8a5a34';rr(x-u*.14,y-u*1.1,u*.28,u*1.1,u*.06);ctx.fill();
      ctx.fillStyle='#3d9f4b';ctx.beginPath();circ(x,y-u*1.9,u*1.0);circ(x-u*.55,y-u*1.4,u*.7);circ(x+u*.55,y-u*1.4,u*.7);ctx.fill();
      ctx.fillStyle='#55b863';ctx.beginPath();circ(x-u*.25,y-u*2.15,u*.5);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}
function drawObstacle(o,z){
  const s=sc(z),x=PX(o.lane,z),y=PY(z,0),u=unit*s,w=laneW*.78*s;
  ctx.globalAlpha=fade(z);
  ctx.fillStyle='rgba(20,70,30,.22)';ctx.beginPath();ctx.ellipse(x,y,w*.6,u*.18,0,0,6.2832);ctx.fill();
  if(o.type==='low'){
    const h=.8*u;
    ctx.fillStyle='#e0953a';rr(x-w/2,y-h,w,h,u*.1);ctx.fill();
    ctx.fillStyle='#f3b865';rr(x-w/2,y-h,w,h*.22,u*.1);ctx.fill();
    ctx.strokeStyle='#a8661d';ctx.lineWidth=Math.max(1,u*.07);
    ctx.beginPath();ctx.moveTo(x-w/2+u*.1,y-h+u*.1);ctx.lineTo(x+w/2-u*.1,y-u*.1);ctx.moveTo(x+w/2-u*.1,y-h+u*.1);ctx.lineTo(x-w/2+u*.1,y-u*.1);ctx.stroke();
    ctx.strokeStyle='#a8661d';rr(x-w/2+u*.04,y-h+u*.04,w-u*.08,h-u*.08,u*.08);ctx.stroke();
  }else if(o.type==='wall'){
    const h=2.4*u;
    ctx.fillStyle='#6c7aa0';rr(x-w/2,y-h,w,h,u*.14);ctx.fill();
    ctx.fillStyle='#8895ba';rr(x-w/2,y-h,w,h*.1,u*.14);ctx.fill();
    ctx.strokeStyle='rgba(30,40,70,.28)';ctx.lineWidth=Math.max(1,u*.05);
    ctx.beginPath();
    for(let r=1;r<6;r++){const yy=y-h+h*r/6;ctx.moveTo(x-w/2,yy);ctx.lineTo(x+w/2,yy)}
    for(let r=0;r<6;r++){
      const yy=y-h+h*r/6,off=r%2?w/4:0;
      for(let c=1;c<3;c++){const xx=x-w/2+off+w*c/3-(r%2?0:0);if(xx>x-w/2+2&&xx<x+w/2-2){ctx.moveTo(xx,yy);ctx.lineTo(xx,yy+h/6)}}
    }
    ctx.stroke();
  }else{ // high: alttan egilerek gec
    const ph=1.5*u,pw=Math.max(2,w*.09);
    ctx.fillStyle='#43506e';
    rr(x-w/2,y-ph,pw,ph,pw*.4);ctx.fill();rr(x+w/2-pw,y-ph,pw,ph,pw*.4);ctx.fill();
    const by=y-1.5*u,bh=.6*u;
    ctx.save();rr(x-w/2,by,w,bh,u*.1);ctx.clip();
    ctx.fillStyle='#fff';ctx.fillRect(x-w/2,by,w,bh);
    ctx.fillStyle='#e5584f';
    const sw=bh*.9;
    for(let sx=x-w/2-bh;sx<x+w/2+bh;sx+=sw*2){ctx.beginPath();ctx.moveTo(sx,by+bh);ctx.lineTo(sx+sw,by+bh);ctx.lineTo(sx+sw+bh,by);ctx.lineTo(sx+bh,by);ctx.closePath();ctx.fill()}
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawPlayer(){
  const x=PX(lane,0),gy=PY(0,0),u=unit;
  // golge
  const sh=1/(1+py*.6);
  ctx.fillStyle='rgba(20,70,30,.28)';ctx.beginPath();ctx.ellipse(x,gy,u*.5*sh,u*.14*sh,0,0,6.2832);ctx.fill();
  const jumping=py>.02;
  const sy=(1-.42*crouch)*(jumping?1+Math.min(.08,Math.abs(vy)*.006):1);
  const sx=1+.14*crouch;
  ctx.save();
  ctx.translate(x,PY(0,py));ctx.scale(sx,sy);
  const ph=runPhase,sw=jumping?0:Math.sin(ph);
  const bob=jumping?0:Math.abs(Math.sin(ph))*.05;
  ctx.translate(0,-bob*u);
  // bacaklar
  ctx.fillStyle='#2e4a85';
  const l1=jumping?.12:Math.max(0,sw)*.28,l2=jumping?.2:Math.max(0,-sw)*.28;
  rr(-.3*u,-.55*u-l1*u,.26*u,.55*u,.1*u);ctx.fill();
  rr(.04*u,-.55*u-l2*u,.26*u,.55*u,.1*u);ctx.fill();
  ctx.fillStyle='#fff';
  rr(-.33*u,-.1*u-l1*u,.32*u,.12*u,.06*u);ctx.fill();rr(.01*u,-.1*u-l2*u,.32*u,.12*u,.06*u);ctx.fill();
  // kollar
  const as=jumping?-.35:sw*.2;
  ctx.fillStyle='#d9473f';
  rr(-.56*u,(-1.05-as*.3)*u,.2*u,.5*u,.1*u);ctx.fill();rr(.36*u,(-1.05+as*.3)*u,.2*u,.5*u,.1*u);ctx.fill();
  ctx.fillStyle='#ffd7b5';
  ctx.beginPath();circ(-.46*u,(-.52-as*.3)*u,.1*u);circ(.46*u,(-.52+as*.3)*u,.1*u);ctx.fill();
  // govde
  ctx.fillStyle='#e5584f';rr(-.4*u,-1.1*u,.8*u,.62*u,.2*u);ctx.fill();
  // sirt cantasi
  ctx.fillStyle='#ffb703';rr(-.3*u,-1.05*u,.6*u,.5*u,.12*u);ctx.fill();
  ctx.fillStyle='#e09a00';rr(-.3*u,-.82*u,.6*u,.05*u,.02*u);ctx.fill();
  // kafa (arkadan: sapka + sac)
  ctx.fillStyle='#ffd7b5';ctx.beginPath();circ(-.31*u,-1.32*u,.08*u);circ(.31*u,-1.32*u,.08*u);ctx.fill();
  ctx.fillStyle='#ffd7b5';ctx.beginPath();circ(0,-1.35*u,.3*u);ctx.fill();
  ctx.fillStyle='#2a3a5c';ctx.beginPath();ctx.moveTo(-.3*u,-1.32*u);ctx.arc(0,-1.35*u,.3*u,Math.PI,0);ctx.lineTo(.3*u,-1.28*u);ctx.quadraticCurveTo(0,-1.1*u,-.3*u,-1.28*u);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e5584f';ctx.beginPath();circ(0,-1.66*u,.07*u);ctx.fill();
  ctx.restore();
}
function drawParts(){
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*22,(Math.random()-.5)*shake*22);
  drawSky();
  hills(horizon*.16,'#a9dcb4',.012,1.2);
  hills(horizon*.10,'#86cf8c',.021,3.3);
  drawGround();
  drawTrees();
  // engeller: uzaktan yakina
  const list=[];
  for(const r of rows){const z=r.z-dist;if(z<ZMAX&&z>-2.5)for(const o of r.obs)list.push({o,z})}
  list.sort((a,b)=>b.z-a.z);
  let drewPlayer=false;
  for(const it of list){
    if(!drewPlayer&&it.z<0){drawPlayer();drewPlayer=true}
    drawObstacle(it.o,it.z);
  }
  if(!drewPlayer)drawPlayer();
  drawParts();
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.55)+')';ctx.fillRect(0,0,W,H)}
}

/* ---------- dongu ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);render();
}

/* ---------- ekran gecisleri ---------- */
function show(id){for(const e of ['ovMenu','ovPause','ovOver'])$(e).hidden=e!==id}
function start(){
  unlock();reset();state='play';show(null);$('hud').hidden=false;
}
function toMenu(){
  reset();state='menu';$('hud').hidden=true;$('bestMenu').textContent=best;show('ovMenu');
}
function pause(){
  if(state!=='play')return;
  state='pause';show('ovPause');
}
function resume(){
  if(state!=='pause')return;
  state='play';show(null);last=performance.now();
}
function paintSound(){
  $('btnSound').innerHTML=muted?ICON_OFF:ICON_ON;
  $('btnSound2').textContent='Ses: '+(muted?'Kapalı':'Açık');
}
function toggleSound(){unlock();muted=!muted;store.set('sk_muted',muted?'1':'0');paintSound();if(!muted)sfx.move()}

$('btnStart').addEventListener('click',start);
$('btnAgain').addEventListener('click',start);
$('btnPause').addEventListener('click',pause);
$('btnResume').addEventListener('click',resume);
$('btnSound').addEventListener('click',toggleSound);
$('btnSound2').addEventListener('click',toggleSound);
$('btnMenu1').addEventListener('click',toMenu);
$('btnMenu2').addEventListener('click',toMenu);

/* ---------- kontroller ---------- */
function act(a){
  if(state!=='play')return;
  if(a==='l'){if(target>-1){target--;sfx.move()}}
  else if(a==='r'){if(target<1){target++;sfx.move()}}
  else if(a==='u'){if(py<=.001){vy=12;py=.001;sliding=false;slideT=0;sfx.jump()}}
  else if(a==='d'){
    if(py>.001){vy=-22}
    else{sliding=true;slideT=.75;sfx.slide()}
  }
}
let tx=0,ty=0,tracking=false;const TH=24;
function swipeMove(cx,cy){
  const dx=cx-tx,dy=cy-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<TH)return;
  if(Math.abs(dx)>Math.abs(dy))act(dx>0?'r':'l');else act(dy<0?'u':'d');
  tx=cx;ty=cy;
}
const onBtn=e=>e.target.closest&&e.target.closest('button');
stage.addEventListener('touchstart',e=>{
  unlock();
  if(onBtn(e))return;
  const p=e.changedTouches[0];tx=p.clientX;ty=p.clientY;tracking=true;e.preventDefault();
},{passive:false});
stage.addEventListener('touchmove',e=>{
  if(onBtn(e)&&!tracking)return;
  e.preventDefault();
  if(!tracking)return;
  const p=e.changedTouches[0];swipeMove(p.clientX,p.clientY);
},{passive:false});
const endT=()=>{tracking=false};
stage.addEventListener('touchend',e=>{endT();unlock()},{passive:true});
stage.addEventListener('touchcancel',endT,{passive:true});
stage.addEventListener('mousedown',e=>{if(onBtn(e))return;tx=e.clientX;ty=e.clientY;tracking=true});
window.addEventListener('mousemove',e=>{if(tracking)swipeMove(e.clientX,e.clientY)});
window.addEventListener('mouseup',endT);
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(state==='menu'&&(k==='Enter'||k===' ')){e.preventDefault();start();return}
  if(state==='over'&&(k==='Enter'||k===' ')){e.preventDefault();start();return}
  if(k==='p'||k==='P'||k==='Escape'){state==='pause'?resume():pause();return}
  if(k==='ArrowLeft'||k==='a'||k==='A')act('l');
  else if(k==='ArrowRight'||k==='d'||k==='D')act('r');
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ')act('u');
  else if(k==='ArrowDown'||k==='s'||k==='S')act('d');
  else return;
  e.preventDefault();
});
// iOS: sikistirma / cift dokunma ile yakinlastirmayi engelle
for(const ev of ['gesturestart','gesturechange','gestureend'])document.addEventListener(ev,e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
window.addEventListener('pagehide',pause);
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));

/* ---------- baslat ---------- */
resize();paintSound();$('bestMenu').textContent=best;
requestAnimationFrame(frame);
window.__sk={get:()=>({state,score,lane,py,sliding,speed,dist})};

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
</script>
